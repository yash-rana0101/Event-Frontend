name: CI/CD Pipeline - Event Frontend

on:
  push:
    {
        "branches": [
            "main",
            "develop"
        ]
    }
  pull_request:
    {
        "branches": [
            "main",
            "develop"
        ]
    }
  workflow_dispatch:
    {}

jobs:
  lint-and-build:
        "name": "Lint and Build",
        "runs-on": "ubuntu-latest",
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Setup Node.js",
                "uses": "actions/setup-node@v4",
                "with": {
                    "node-version": "20",
                    "cache": "npm"
                }
            },
            {
                "name": "Install dependencies",
                "run": "npm ci"
            },
            {
                "name": "Run linter",
                "run": "npm run lint",
                "continue-on-error": true
            },
            {
                "name": "Build application",
                "run": "npm run build"
            },
            {
                "name": "Upload build artifacts",
                "uses": "actions/upload-artifact@v4",
                "with": {
                    "name": "dist",
                    "path": "dist/",
                    "retention-days": 7
                }
            }
        ]
  docker-build:
        "name": "Build and Push Docker Image",
        "runs-on": "ubuntu-latest",
        "needs": "lint-and-build",
        "if": "github.event_name == 'push'",
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Configure AWS credentials",
                "uses": "aws-actions/configure-aws-credentials@v4",
                "with": {
                    "aws-access-key-id": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                    "aws-secret-access-key": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                    "aws-region": "us-east-1"
                }
            },
            {
                "name": "Login to Amazon ECR",
                "id": "login-ecr",
                "uses": "aws-actions/amazon-ecr-login@v2"
            },
            {
                "name": "Set up Docker Buildx",
                "uses": "docker/setup-buildx-action@v3"
            },
            {
                "name": "Build, tag, and push image to Amazon ECR",
                "env": {
                    "ECR_REGISTRY": "${{ steps.login-ecr.outputs.registry }}",
                    "ECR_REPOSITORY": "event-frontend",
                    "IMAGE_TAG": "${{ github.sha }}"
                },
                "run": "docker buildx build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest --push ."
            }
        ]
  deploy-to-aws:
        "name": "Deploy to AWS",
        "runs-on": "ubuntu-latest",
        "needs": "docker-build",
        "if": "github.ref == 'refs/heads/main' && github.event_name == 'push'",
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Configure AWS credentials",
                "uses": "aws-actions/configure-aws-credentials@v4",
                "with": {
                    "aws-access-key-id": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                    "aws-secret-access-key": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                    "aws-region": "us-east-1"
                }
            },
            {
                "name": "Setup Terraform",
                "uses": "hashicorp/setup-terraform@v3",
                "with": {
                    "terraform_version": "1.6.0"
                }
            },
            {
                "name": "Terraform Init",
                "working-directory": "./terraform",
                "run": "terraform init"
            },
            {
                "name": "Terraform Plan",
                "working-directory": "./terraform",
                "run": "terraform plan -var='image_tag=${{ github.sha }}' -out=tfplan"
            },
            {
                "name": "Terraform Apply",
                "working-directory": "./terraform",
                "run": "terraform apply -auto-approve tfplan"
            },
            {
                "name": "Update ECS Service",
                "run": "aws ecs update-service --cluster event-frontend-cluster --service event-frontend-service --force-new-deployment --region us-east-1"
            }
        ]
  security-scan:
        "name": "Security Scan",
        "runs-on": "ubuntu-latest",
        "needs": "docker-build",
        "if": "github.event_name == 'push'",
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Configure AWS credentials",
                "uses": "aws-actions/configure-aws-credentials@v4",
                "with": {
                    "aws-access-key-id": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                    "aws-secret-access-key": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                    "aws-region": "us-east-1"
                }
            },
            {
                "name": "Login to Amazon ECR",
                "id": "login-ecr",
                "uses": "aws-actions/amazon-ecr-login@v2"
            },
            {
                "name": "Run Trivy vulnerability scanner",
                "uses": "aquasecurity/trivy-action@master",
                "with": {
                    "image-ref": "${{ steps.login-ecr.outputs.registry }}/event-frontend:${{ github.sha }}",
                    "format": "sarif",
                    "output": "trivy-results.sarif"
                }
            },
            {
                "name": "Upload Trivy results to GitHub Security",
                "uses": "github/codeql-action/upload-sarif@v3",
                "with": {
                    "sarif_file": "trivy-results.sarif"
                }
            }
        ]