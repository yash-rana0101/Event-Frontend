name: CI/CD Pipeline

on:
  push:
    {
        "branches": [
            "main",
            "develop"
        ]
    }
  pull_request:
    {
        "branches": [
            "main",
            "develop"
        ]
    }
  workflow_dispatch:
    {}

jobs:
  lint-and-build:
        "name": "Lint and Build",
        "runs-on": "ubuntu-latest",
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Setup Node.js",
                "uses": "actions/setup-node@v4",
                "with": {
                    "node-version": "18",
                    "cache": "npm"
                }
            },
            {
                "name": "Install dependencies",
                "run": "npm ci"
            },
            {
                "name": "Run linter",
                "run": "npm run lint"
            },
            {
                "name": "Build application",
                "run": "npm run build"
            },
            {
                "name": "Upload build artifacts",
                "uses": "actions/upload-artifact@v4",
                "with": {
                    "name": "build-artifacts",
                    "path": "build/",
                    "retention-days": 7
                }
            }
        ]
  security-scan:
        "name": "Security Scan",
        "runs-on": "ubuntu-latest",
        "needs": "lint-and-build",
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Setup Node.js",
                "uses": "actions/setup-node@v4",
                "with": {
                    "node-version": "18",
                    "cache": "npm"
                }
            },
            {
                "name": "Install dependencies",
                "run": "npm ci"
            },
            {
                "name": "Run npm audit",
                "run": "npm audit --audit-level=moderate",
                "continue-on-error": true
            },
            {
                "name": "Run Trivy vulnerability scanner",
                "uses": "aquasecurity/trivy-action@master",
                "with": {
                    "scan-type": "fs",
                    "scan-ref": ".",
                    "format": "sarif",
                    "output": "trivy-results.sarif",
                    "severity": "CRITICAL,HIGH"
                }
            },
            {
                "name": "Upload Trivy results to GitHub Security",
                "uses": "github/codeql-action/upload-sarif@v3",
                "with": {
                    "sarif_file": "trivy-results.sarif"
                }
            }
        ]
  build-and-push-docker:
        "name": "Build and Push Docker Image",
        "runs-on": "ubuntu-latest",
        "needs": [
            "lint-and-build",
            "security-scan"
        ],
        "if": "github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')",
        "outputs": {
            "image-tag": "${{ steps.meta.outputs.tags }}"
        },
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Configure AWS credentials",
                "uses": "aws-actions/configure-aws-credentials@v4",
                "with": {
                    "aws-access-key-id": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                    "aws-secret-access-key": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                    "aws-region": "us-east-1"
                }
            },
            {
                "name": "Login to Amazon ECR",
                "id": "login-ecr",
                "uses": "aws-actions/amazon-ecr-login@v2"
            },
            {
                "name": "Set up Docker Buildx",
                "uses": "docker/setup-buildx-action@v3"
            },
            {
                "name": "Extract metadata for Docker",
                "id": "meta",
                "run": "echo \"tags=${{ steps.login-ecr.outputs.registry }}/event-frontend:${{ github.sha }}\" >> $GITHUB_OUTPUT"
            },
            {
                "name": "Build and push Docker image",
                "uses": "docker/build-push-action@v5",
                "with": {
                    "context": ".",
                    "push": true,
                    "tags": "${{ steps.meta.outputs.tags }}",
                    "cache-from": "type=gha",
                    "cache-to": "type=gha,mode=max",
                    "platforms": "linux/amd64"
                }
            }
        ]
  deploy-to-aws:
        "name": "Deploy to AWS",
        "runs-on": "ubuntu-latest",
        "needs": "build-and-push-docker",
        "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'",
        "environment": {
            "name": "production",
            "url": "https://event-frontend.example.com"
        },
        "steps": [
            {
                "name": "Checkout code",
                "uses": "actions/checkout@v4"
            },
            {
                "name": "Configure AWS credentials",
                "uses": "aws-actions/configure-aws-credentials@v4",
                "with": {
                    "aws-access-key-id": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                    "aws-secret-access-key": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                    "aws-region": "us-east-1"
                }
            },
            {
                "name": "Setup Terraform",
                "uses": "hashicorp/setup-terraform@v3",
                "with": {
                    "terraform_version": "1.6.0"
                }
            },
            {
                "name": "Terraform Init",
                "run": "terraform init",
                "working-directory": "./terraform"
            },
            {
                "name": "Terraform Plan",
                "run": "terraform plan -var=\"image_tag=${{ github.sha }}\" -out=tfplan",
                "working-directory": "./terraform"
            },
            {
                "name": "Terraform Apply",
                "run": "terraform apply -auto-approve tfplan",
                "working-directory": "./terraform"
            },
            {
                "name": "Update ECS Service",
                "run": "aws ecs update-service --cluster event-frontend-cluster --service event-frontend-service --force-new-deployment --region us-east-1"
            },
            {
                "name": "Wait for ECS Service Stability",
                "run": "aws ecs wait services-stable --cluster event-frontend-cluster --services event-frontend-service --region us-east-1"
            }
        ]